on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: CI

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::targets
          needs: check

      - name: Run unit tests
        run: Rscript tests/testthat.R

      - name: Validate the pipeline definition
        run: Rscript -e 'targets::tar_manifest()'
